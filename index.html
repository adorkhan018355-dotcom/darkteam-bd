<!-- LOGIN MODAL -->

<button class="mt-4 w-full py-2 bg-cyan-500/10 border border-cyan-400 rounded text-xs">START LAB (Educational Sandbox)</button>
</div></div>

<script>
const data=[
{t:'01. RECON & OSINT',d:'Open-source intelligence • WHOIS • Subdomain scanning • Social footprint',c:'ethical',g:'<b class="text-[#b6ff6a]">✅ 100% REAL GUIDELINE:</b><br>• who.is, shodan.io, hunter.io use koro<br>• sudhu public info collect koro<br>• nijer domain e test koro, onner ta te permission chara na<br>• Tools: theHarvester, Sublist3r (Termux)'},
{t:'02. NETWORK SCANNING',d:'Port scanning • Vulnerability assess • Service discovery • Nmap toolkit',c:'termux',g:'<b class="text-[#b6ff6a]">✅ TERMUX REAL COMMAND:</b><br>pkg update && pkg install nmap<br>nmap -sV -A 127.0.0.1<br>• Shudhu nijer network e use koro<br>• TryHackMe e practice koro'},
{t:'03. EXPLOITATION LAB',d:'Safe exploit training • Payload analysis • Vulnerability demo • Isolated env',c:'ethical',g:'<b class="text-[#b6ff6a]">✅ SAFE LAB:</b><br>• TryHackMe / HackTheBox e account khulo<br>• VMWare / VirtualBox e vulnerable machine (Metasploitable) setup koro<br>• Payload: msfvenom use shikho ethical lab e'},
{t:'04. PASSWORD & HASH CRACKING',d:'Hash cracking labs • Password strength • Dictionary & bruteforce • Best practices',c:'ethical',g:'<b class="text-[#b6ff6a]">✅ SECURITY GUIDE:</b><br>• Password 12+ character, 2FA on rakho<br>• Hashcat: hashcat -m 0 hash.txt wordlist.txt<br>• Nijer hash diye practice koro'},
{t:'05. FACEBOOK SECURITY LAB',d:'ID secure • 2FA • Phishing check • Recovery',c:'facebook',g:'<b class="text-[#b6ff6a]">✅ FB REAL SECURITY:</b><br>1. Facebook > Settings > Password & Security > Two-Factor ON<br>2. Login Alerts ON<br>3. facebook.com chara onno link e login korbe na<br>4. Trusted contacts add koro'},
{t:'06. GMAIL SECURITY LAB',d:'Encryption/Decryption • App password • 2-Step verification',c:'gmail',g:'<b class="text-[#b6ff6a]">✅ GMAIL GUIDE:</b><br>myaccount.google.com > Security > 2-Step ON<br>• App Password create koro<br>• Unknown device remove koro<br>• Phishing mail report koro'},
{t:'07. DEFENSE & MONITORING',d:'SIEM basics • Log monitoring • IDS/IPS • Threat response • Termux',c:'number',g:'<b class="text-[#b6ff6a]">✅ DEFENSE LAB:</b><br>• Wazuh, Suricata SIEM shikho<br>• Termux e: pkg install python, log analysis<br>• Blue team skills develop koro'},
];
let user=JSON.parse(localStorage.getItem('dtbd_u')||'null');
function draw(filter='all'){let h='';data.forEach((x,i)=>{if(filter!=='all'&&x.c!==filter)return;h+=`<div class="neon bg-black/80 p-5 rounded-xl hover:bg-black transition"><div class="flex justify-between"><span class="text-cyan-300">🛡️</span><span class="text-[8px] border border-cyan-800 px-2 py-0.5 rounded-full">${x.c.toUpperCase()}</span></div><h3 class="orbit text-[#b6ff6a] text-[11px] mt-3 leading-tight">${x.t}</h3><p class="text-[10px] text-cyan-200/70 mt-2 h-8">${x.d}</p><button onclick="openT(${i})" class="mt-4 w-full text-[10px] border ${user?'border-[#b6ff6a] text-[#b6ff6a]':'border-cyan-700 text-cyan-400'} py-2 rounded-full">${user?'▶ OPEN LAB':'🔒 LOGIN TO USE'}</button></div>`});document.getElementById('grid').innerHTML=h;
if(user){let isAdmin=user.e==='adorkhan@admindarkteam.com' && user.p==='#aDoR@9070';document.getElementById('authArea').innerHTML=`<div class="flex items-center gap-2"><span class="text-[11px] text-green-400">${user.n}</span>${isAdmin?`<button onclick="openAdmin()" class="text-[9px] bg-red-500/20 border border-red-400 px-2 py-1 rounded">ADMIN</button>`:''}<button onclick="logout()" class="text-[9px] border border-gray-600 px-2 py-1 rounded">Logout</button></div>`}}
function openT(i){if(!user){openLogin();return}let x=data[i];document.getElementById('tTitle').innerText=x.t;document.getElementById('tGuide').innerHTML=x.g;document.getElementById('toolBox').classList.remove('hidden');let a=document.getElementById('tAnim');a.innerHTML='';let lines=[`> dtbd@cyber-lab:~$ initializing ${x.c} module`,`> loading ${x.t}...`,`> secure sandbox: ACTIVE`,`> educational mode: ON`,`> ✅ READY`];let j=0;let iv=setInterval(()=>{if(j<lines.length){a.innerHTML+=lines[j]+'<br>';j++}else clearInterval(iv)},350)}
function openLogin(){document.getElementById('login').classList.remove('hidden')}function closeLogin(){document.getElementById('login').classList.add('hidden')}
function doReg(){let n=document.getElementById('n').value,e=document.getElementById('e').value,p=document.getElementById('p').value;if(!e||!p||!n)return alert('Name, Email, Password sob daw');let u={n,e,p,t:new Date().toLocaleString()};localStorage.setItem('dtbd_u',JSON.stringify(u));let all=JSON.parse(localStorage.getItem('dtbd_users')||'[]');all.push(u);localStorage.setItem('dtbd_users',JSON.stringify(all));location.reload()}
function logout(){localStorage.removeItem('dtbd_u');location.reload()}
function openAdmin(){let all=JSON.parse(localStorage.getItem('dtbd_users')||'[]');let list=all.map((u,i)=>`${i+1}. ${u.n} | ${u.e} | ${u.t}`).join('<br>');document.getElementById('tTitle').innerText='ADMIN PANEL - Total Users: '+all.length;document.getElementById('tGuide').innerHTML=list||'No users yet';document.getElementById('tAnim').innerHTML='> admin@dtbd:~# access granted<br>> listing users...';document.getElementById('toolBox').classList.remove('hidden')}
draw();
</script>
<footer class="text-center text-[9px] text-gray-600 p-6 mt-6 border-t border-cyan-900/20">DARK TEAM BD — Ethical Hacking Education | Lab Safety: Isolated VM | No Malicious Use | DTBD v1.0 | Training Only</footer>
</body>

<script>

// পুরান openT ফাংশনকে নতুন দিয়ে Replace
function openT(i){
  if(!user){ openLogin(); return; }
  let lab = subTools[i];
  document.getElementById('subTitle').innerText = data[i].t;
  let html = `<p style="color:gray;font-size:12px;margin-bottom:10px;">${data[i].d}</p>`;
  lab.forEach((t,idx)=>{
    html += `<div class="sub-card"><button class="sub-btn" onclick="subTools[${i}][${idx}].f()">${t.n}</button></div>`;
  });
  html += `<button class="sub-btn2" onclick="closeSub()">⬅️ Back to Tools</button>`;
  document.getElementById('subContent').innerHTML = html;
  document.getElementById('subLab').style.display='block';
}
function closeSub(){ document.getElementById('subLab').style.display='none'; }
</script>
